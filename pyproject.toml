[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "anime-telegram"
version = "2.0.0"
description = "Respaldo de anime en canales privados de Telegram, ordenado por temporadas."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "telethon>=1.40,<2",
    "cryptg>=0.4",
    "anitopy>=2.1",
    "pillow>=10",
    "aiohttp>=3.9",
    "pywebview>=5",
    "keyring>=24",
    "rich>=13",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
animetg = "animetg.cli:main"

[project.gui-scripts]
anime-telegram = "animetg.escritorio:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
animetg = ["web/estaticos/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "red: necesita internet (AniList)",
    "ffmpeg: necesita ffmpeg instalado",
]
